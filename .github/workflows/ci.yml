name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        shell: bash
        run: for m in . validator sql jwt jobs password cache redis cmd/gonestly examples/tasks; do (cd $m && go mod verify) || exit 1; done
      - name: Test
        shell: bash
        run: |
          go test -race -shuffle=on -coverprofile=coverage.out ./...
          (cd validator && go test -race -shuffle=on ./...)
          (cd sql && go test -race -shuffle=on ./...)
          (cd jwt && go test -race -shuffle=on ./...)
          (cd jobs && go test -race -shuffle=on ./...)
          (cd password && go test -race -shuffle=on ./...)
          (cd cache && go test -race -shuffle=on ./...)
          (cd redis && go test -race -shuffle=on ./...)
          (cd cmd/gonestly && go test -race -shuffle=on ./...)
          (cd examples/tasks && go test -race -shuffle=on ./...)
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: SQL against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: gonestly
          POSTGRES_DB: gonestly
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Test
        working-directory: sql
        env:
          GONESTLY_TEST_POSTGRES: postgres://postgres:gonestly@localhost:5432/gonestly?sslmode=disable
        run: go test -race -shuffle=on -v ./... 2>&1 | tee /dev/stderr | (! grep -q "SKIP.*postgres")
      - name: Jobs
        working-directory: jobs
        env:
          GONESTLY_TEST_POSTGRES: postgres://postgres:gonestly@localhost:5432/gonestly?sslmode=disable
        run: go test -race -shuffle=on -v ./... 2>&1 | tee /dev/stderr | (! grep -q "SKIP.*postgres")
      - name: Create databases from the CLI
        working-directory: cmd/gonestly
        env:
          GONESTLY_TEST_POSTGRES: postgres://postgres:gonestly@localhost:5432/gonestly?sslmode=disable
        run: go test -race -shuffle=on -v -run TestCreateOnServers/postgres ./internal/dbsetup 2>&1 | tee /dev/stderr | (! grep -q "SKIP")
      - name: Schema migrations
        working-directory: cmd/gonestly
        env:
          GONESTLY_TEST_POSTGRES: postgres://postgres:gonestly@localhost:5432/gonestly?sslmode=disable
        run: go test -race -shuffle=on -v ./internal/schema 2>&1 | tee /dev/stderr | (! grep -q "SKIP")

  mysql:
    name: SQL against ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -pgonestly
          - name: MariaDB
            image: mariadb:11
            health: healthcheck.sh --connect --innodb_initialized
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: gonestly
          MYSQL_DATABASE: gonestly
        ports: ["3306:3306"]
        options: --health-cmd "${{ matrix.health }}" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Test
        working-directory: sql
        env:
          GONESTLY_TEST_MYSQL: root:gonestly@tcp(127.0.0.1:3306)/gonestly
        run: go test -race -shuffle=on -v ./... 2>&1 | tee /dev/stderr | (! grep -q "SKIP.*mysql")
      - name: Jobs
        working-directory: jobs
        env:
          GONESTLY_TEST_MYSQL: root:gonestly@tcp(127.0.0.1:3306)/gonestly
        run: go test -race -shuffle=on -v ./... 2>&1 | tee /dev/stderr | (! grep -q "SKIP.*mysql")
      - name: Create databases from the CLI
        working-directory: cmd/gonestly
        env:
          GONESTLY_TEST_MYSQL: root:gonestly@tcp(127.0.0.1:3306)/gonestly
        run: go test -race -shuffle=on -v -run TestCreateOnServers/mysql ./internal/dbsetup 2>&1 | tee /dev/stderr | (! grep -q "SKIP")
      - name: Schema migrations
        working-directory: cmd/gonestly
        env:
          GONESTLY_TEST_MYSQL: root:gonestly@tcp(127.0.0.1:3306)/gonestly
        run: go test -race -shuffle=on -v ./internal/schema 2>&1 | tee /dev/stderr | (! grep -q "SKIP")

  redis:
    name: Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Test
        working-directory: redis
        env:
          GONESTLY_TEST_REDIS: redis://localhost:6379/0
        run: go test -race -shuffle=on -v ./... 2>&1 | tee /dev/stderr | (! grep -q "SKIP")

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Check go.mod is tidy
        run: for m in . validator sql jwt jobs password cache redis cmd/gonestly examples/tasks; do (cd $m && go mod tidy -diff) || exit 1; done
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: validator
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: sql
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: jwt
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: jobs
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: password
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: cache
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: redis
          args: --config ../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: cmd/gonestly
          args: --config ../../.golangci.yml
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: examples/tasks
          args: --config ../../.golangci.yml

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
      - name: Run govulncheck
        run: for m in . validator sql jwt jobs password cache redis cmd/gonestly examples/tasks; do (cd $m && go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...) || exit 1; done
